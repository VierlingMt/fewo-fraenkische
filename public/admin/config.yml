# Sveltia CMS – Bearbeitungsoberfläche unter /admin/
# Anmeldung: "Mit Zugangstoken anmelden" und einen GitHub-Token mit Schreibrechten auf dieses Repo verwenden.
# Jede gespeicherte Änderung ist ein Commit im Repo und löst automatisch den Deploy aus.
backend:
  name: github
  repo: VierlingMt/fewo-fraenkische
  branch: claude/gifted-wright-bu03up
  commit_messages:
    create: 'Inhalt: {{collection}} „{{slug}}“ angelegt'
    update: 'Inhalt: {{collection}} „{{slug}}“ geändert'
    delete: 'Inhalt: {{collection}} „{{slug}}“ gelöscht'
    uploadMedia: 'Bild: „{{path}}“ hochgeladen'
    deleteMedia: 'Bild: „{{path}}“ gelöscht'

locale: de
site_url: https://www.fewo-fraenkische.de
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: news
    label: News & Tipps
    label_singular: Beitrag
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    sortable_fields: [pubDate, title]
    summary: '{{title}} ({{pubDate | date("DD.MM.YYYY")}})'
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Kurzbeschreibung (für Google & Vorschau), widget: text }
      - { name: pubDate, label: Datum, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: bild, label: Bild, widget: image, required: false }
      - { name: bildAlt, label: Bildbeschreibung, widget: string, required: false }
      - { name: tags, label: Schlagworte, widget: list, required: false }
      - { name: draft, label: Entwurf (nicht veröffentlichen), widget: boolean, default: false, required: false }
      - { name: body, label: Text, widget: markdown }

  - name: wohnungen
    label: Ferienwohnungen
    label_singular: Ferienwohnung
    folder: src/content/wohnungen
    create: false
    delete: false
    fields:
      - { name: title, label: Name, widget: string }
      - { name: teaser, label: Kurzbeschreibung, widget: text }
      - { name: order, label: Reihenfolge, widget: number, value_type: int }
      - { name: personenMin, label: Min. Personen, widget: number, value_type: int, required: false }
      - { name: personen, label: Max. Personen, widget: number, value_type: int, required: false }
      - { name: schlafzimmer, label: Schlafzimmer, widget: number, value_type: int, required: false }
      - { name: groesse, label: Größe (m²), widget: number, value_type: int, required: false }
      - { name: preisAb, label: Preis ab (€ / Nacht), widget: number, value_type: int, required: false }
      - { name: ausstattung, label: Ausstattung, widget: list, required: false }
      - { name: bild, label: Titelbild, widget: image, required: false }
      - { name: bildAlt, label: Bildbeschreibung, widget: string, required: false }
      - { name: bookingUrl, label: Link Booking.com, widget: string, required: false }
      - { name: body, label: Beschreibung, widget: markdown }

  - name: seiten
    label: Rechtliches & Seiten
    label_singular: Seite
    folder: src/content/seiten
    create: false
    delete: false
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Kurzbeschreibung, widget: text }
      - { name: body, label: Text, widget: markdown }
