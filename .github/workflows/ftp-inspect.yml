# Listet die Ordnerstruktur auf dem FTP-Server auf (nur lesend).
# Start: GitHub → Actions → "FTP-Server ansehen" → "Run workflow".
name: FTP-Server ansehen

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Startordner auf dem Server"
        default: "/"
        required: true
      depth:
        description: "Wie viele Ordnerebenen tief"
        default: "2"
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Ordner auflisten
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          INSPECT_PATH: ${{ inputs.path }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set -euo pipefail
          for v in FTP_SERVER FTP_USERNAME LFTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret für $v fehlt"; exit 1; fi
          done
          [[ "$DEPTH" =~ ^[0-9]+$ ]] || { echo "::error::depth muss eine Zahl sein"; exit 1; }

          lftp -u "$FTP_USERNAME" --env-password "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 20;
            cd \"$INSPECT_PATH\";
            echo '=== Inhalt von $INSPECT_PATH (mit Größe/Datum) ===';
            cls -l --sort=name;
            echo '';
            echo '=== Ordnerbaum, Tiefe $DEPTH ===';
            find --maxdepth=$DEPTH .;
            bye" | tee listing.txt

          {
            echo "### FTP-Inhalt von \`$INSPECT_PATH\`"
            echo '```'
            head -n 500 listing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
