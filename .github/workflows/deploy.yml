# Baut die Website (Astro) und lädt sie per FTPS auf den Server bei All-Inkl.
# Zielordner: /www/ (www.fewo-fraenkische.de und www.fewo-ebermannstadt.de), überschreibbar per Repo-Variable FTP_SERVER_DIR.
# Läuft bei jedem Push, manuell und mehrmals täglich (aktualisiert die Regional-News).
name: Deploy (FTP)

on:
  push:
    branches: [main, claude/gifted-wright-bu03up]
  workflow_dispatch:
  schedule:
    # 05:17, 11:17 und 17:17 UTC
    - cron: '17 5,11,17 * * *'

permissions:
  contents: read

env:
  SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/www/' }}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Zielordner prüfen
        run: |
          if [[ "$SERVER_DIR" != */ ]]; then
            echo "::error::Zielordner muss mit / enden, z. B. /www/"
            exit 1
          fi
          echo "Ziel: $SERVER_DIR"

      - run: npm ci

      - name: Regional-News abrufen
        run: npm run news
        continue-on-error: true

      - name: Veranstaltungen abrufen
        run: npm run events
        continue-on-error: true

      - run: npm run check

      - run: npm run build

      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.SERVER_DIR }}
