# Lädt die fertige Website per FTPS auf den Server bei All-Inkl.
# Vorerst nur manuell: GitHub → Actions → "Deploy (FTP)" → "Run workflow".
# Der Zielordner kommt aus der Repo-Variable FTP_SERVER_DIR, z. B. "/neu-test/".
name: Deploy (FTP)

on:
  workflow_dispatch:
  # Automatisch bei jedem Push aktivieren, sobald der Zielordner feststeht:
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Zielordner prüfen
        env:
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          if [ -z "$SERVER_DIR" ]; then
            echo "::error::Repo-Variable FTP_SERVER_DIR fehlt (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          if [[ "$SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR muss mit / enden, z. B. /neu-test/"
            exit 1
          fi
          echo "Ziel: $SERVER_DIR"

      # Später kommt hier der Build der Website (Astro) hin, der nach ./dist/ baut.

      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
